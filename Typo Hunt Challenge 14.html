<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typo Hunt Challenge - Professional Edition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1877F2;
            --secondary-color: #42B883;
            --danger-color: #E74C3C;
            --warning-color: #F39C12;
            --dark-color: #2C3E50;
            --light-color: #ECF0F1;
            --success-color: #27AE60;
            --info-color: #3498DB;
            --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--gradient-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .game-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
            transition: var(--transition);
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 20px 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
            max-width: 600px;
            margin: 0 auto;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--light-color);
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--dark-color);
            min-width: 120px;
        }

        .stat-item i {
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        .timer {
            font-size: 1.2em;
            color: var(--danger-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .difficulty-selector {
            padding: 20px 30px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .difficulty-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        .difficulty-btn.easy {
            background: var(--success-color);
            color: white;
        }

        .difficulty-btn.medium {
            background: var(--warning-color);
            color: white;
        }

        .difficulty-btn.hard {
            background: var(--danger-color);
            color: white;
        }

        .difficulty-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .difficulty-btn.active {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .game-area {
            padding: 30px;
            min-height: 400px;
        }

        .text-container {
            position: relative;
            margin-bottom: 20px;
        }

        .text-content {
            background: #f8f9fa;
            padding: 25px;
            border-radius: var(--border-radius);
            border: 2px solid #e9ecef;
            font-size: 1.1em;
            line-height: 1.8;
            cursor: text;
            user-select: text;
            max-height: 300px;
            overflow-y: auto;
            position: relative;
        }

        .hint-text {
            position: absolute;
            top: -35px;
            left: 0;
            font-size: 0.9em;
            color: #6c757d;
            font-style: italic;
            transition: var(--transition);
        }

        .progress-container {
            background: #e9ecef;
            height: 8px;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--success-color);
            transition: width 0.5s ease;
            width: 0%;
        }

        .error-word {
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .error-word:hover {
            background: rgba(231, 76, 60, 0.15);
        }

        .error-word.found {
            background: var(--success-color);
            color: white;
            animation: found 0.5s ease;
        }

        @keyframes found {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .error-word.incorrect {
            background: var(--danger-color);
            color: white;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 150px;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-info {
            background: var(--info-color);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results {
            text-align: center;
            padding: 25px;
            background: #f8f9fa;
            border-radius: var(--border-radius);
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results h3 {
            color: var(--dark-color);
            margin-bottom: 20px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .score-item {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: var(--transition);
        }

        .score-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .score-item .label {
            color: #6c757d;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .score-item .value {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .achievements-container {
            margin: 25px 0;
        }

        .achievement {
            background: var(--warning-color);
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.95em;
            margin: 8px;
            display: inline-block;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .leaderboard {
            margin-top: 25px;
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .leaderboard h4 {
            color: var(--dark-color);
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            transition: var(--transition);
        }

        .leaderboard-entry:hover {
            background: #f8f9fa;
        }

        .leaderboard-entry:last-child {
            border-bottom: none;
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        .tooltip {
            position: relative;
            cursor: help;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark-color);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 1000;
            pointer-events: none;
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
        }

        .insight-item {
            padding: 15px;
            background: white;
            border-radius: var(--border-radius);
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid var(--info-color);
            transition: var(--transition);
        }

        .insight-item:hover {
            transform: translateX(5px);
        }

        .insight-icon {
            margin-right: 10px;
            color: var(--info-color);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .game-container {
                margin: 10px;
            }
            
            .header {
                padding: 15px 20px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .stats-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .difficulty-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .difficulty-btn {
                width: 100%;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .score-details {
                grid-template-columns: 1fr;
            }
            
            .text-content {
                padding: 20px 15px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            .btn {
                width: 100%;
            }
            
            .stat-item {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1><i class="fas fa-search"></i> Typo Hunt Challenge</h1>
            <p>Professional Edition - Find typos and grammar errors with precision</p>
        </div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <i class="fas fa-bullseye"></i>
                <span>Found: <span id="found-count">0</span></span>
            </div>
            <div class="stat-item">
                <i class="fas fa-target"></i>
                <span>Total Errors: <span id="total-errors">0</span></span>
            </div>
            <div class="stat-item timer">
                <i class="fas fa-clock"></i>
                <span id="timer">00:00</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-star"></i>
                <span>Score: <span id="score">0</span></span>
            </div>
            <div class="stat-item">
                <i class="fas fa-chart-line"></i>
                <span>Accuracy: <span id="accuracy">100%</span></span>
            </div>
        </div>

        <div class="difficulty-selector">
            <h3>Select Difficulty Level</h3>
            <div class="difficulty-buttons">
                <button class="difficulty-btn easy active" data-difficulty="easy">
                    <i class="fas fa-seedling"></i> Easy
                </button>
                <button class="difficulty-btn medium" data-difficulty="medium">
                    <i class="fas fa-fire"></i> Medium
                </button>
                <button class="difficulty-btn hard" data-difficulty="hard">
                    <i class="fas fa-bolt"></i> Hard
                </button>
            </div>
        </div>

        <div class="game-area">
            <div id="game-content">
                <div class="text-container">
                    <div class="hint-text" id="hint-text">Click on errors to mark them</div>
                    <div class="text-content" id="text-content">
                        <!-- Content will be loaded here -->
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn btn-primary" id="start-btn">
                        <i class="fas fa-play"></i> Start Game
                    </button>
                    <button class="btn btn-warning hidden" id="hint-btn">
                        <i class="fas fa-lightbulb"></i> Hint (<span id="hints-left">3</span>)
                    </button>
                    <button class="btn btn-success hidden" id="submit-btn">
                        <i class="fas fa-check"></i> Submit
                    </button>
                </div>
            </div>

            <div id="results" class="results hidden">
                <!-- Results will be shown here -->
            </div>
        </div>
    </div>

    <script>
        class TypoHuntGame {
            constructor() {
                this.currentDifficulty = 'easy';
                this.gameActive = false;
                this.startTime = null;
                this.foundErrors = 0;
                this.totalErrors = 0;
                this.incorrectClicks = 0;
                this.hintsUsed = 0;
                this.maxHints = 3;
                this.timerInterval = null;
                this.currentText = null;
                this.achievements = [];
                this.gameStats = JSON.parse(localStorage.getItem('typoHuntStats')) || {
                    gamesPlayed: 0,
                    totalScore: 0,
                    bestTime: null,
                    bestAccuracy: 0,
                    achievements: []
                };

                this.initializeElements();
                this.bindEvents();
                this.loadContent();
            }

            initializeElements() {
                this.elements = {
                    difficultyBtns: document.querySelectorAll('.difficulty-btn'),
                    startBtn: document.getElementById('start-btn'),
                    hintBtn: document.getElementById('hint-btn'),
                    submitBtn: document.getElementById('submit-btn'),
                    textContent: document.getElementById('text-content'),
                    gameContent: document.getElementById('game-content'),
                    results: document.getElementById('results'),
                    timer: document.getElementById('timer'),
                    foundCount: document.getElementById('found-count'),
                    totalErrorsSpan: document.getElementById('total-errors'),
                    score: document.getElementById('score'),
                    accuracy: document.getElementById('accuracy'),
                    hintsLeft: document.getElementById('hints-left'),
                    progressBar: document.getElementById('progress-bar'),
                    hintText: document.getElementById('hint-text')
                };
            }

            bindEvents() {
                // Difficulty selection
                this.elements.difficultyBtns.forEach(btn => {
                    btn.addEventListener('click', () => this.selectDifficulty(btn.dataset.difficulty));
                });

                // Game controls
                this.elements.startBtn.addEventListener('click', () => this.startGame());
                this.elements.hintBtn.addEventListener('click', () => this.showHint());
                this.elements.submitBtn.addEventListener('click', () => this.submitGame());

                // Text content clicks
                this.elements.textContent.addEventListener('click', (e) => this.handleTextClick(e));
                
                // Double-click to mark as error
                this.elements.textContent.addEventListener('dblclick', (e) => this.handleTextDblClick(e));
            }

            selectDifficulty(difficulty) {
                this.currentDifficulty = difficulty;
                this.elements.difficultyBtns.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.difficulty === difficulty) {
                        btn.classList.add('active');
                    }
                });
                this.loadContent();
            }

            loadContent() {
                const content = this.getContentForDifficulty(this.currentDifficulty);
                this.currentText = content;
                this.totalErrors = content.errors.length;
                this.elements.totalErrorsSpan.textContent = this.totalErrors;
                this.elements.textContent.innerHTML = this.generateTextHTML(content);
                this.updateProgressBar();
            }

            getContentForDifficulty(difficulty) {
                const contents = {
                    easy: {
                        text: "The quick brown fox jumps over the lazy dog. This sentance contains several erors that need to be found. Their are common mistakes that writers make every day. Its important to proofreading your work carefully. Many people dont realize how much difference good grammer makes in profesional communication.",
                        errors: [
                            {word: "sentance", correct: "sentence", position: 0},
                            {word: "erors", correct: "errors", position: 1},
                            {word: "Their", correct: "There", position: 2},
                            {word: "Its", correct: "It's", position: 3},
                            {word: "proofreading", correct: "proofread", position: 4},
                            {word: "dont", correct: "don't", position: 5},
                            {word: "grammer", correct: "grammar", position: 6},
                            {word: "profesional", correct: "professional", position: 7}
                        ]
                    },
                    medium: {
                        text: "The companys annual report shows significant growth in revnue and profit margins. However, their methodology for calculating these figures remains unclear. The board of directors have approved the new budget, but some stakeholders are skeptical about it's viability. We need to ensure that all departements are aligned with the strategic objectives.",
                        errors: [
                            {word: "companys", correct: "company's", position: 0},
                            {word: "revnue", correct: "revenue", position: 1},
                            {word: "their", correct: "the", position: 2},
                            {word: "have", correct: "has", position: 3},
                            {word: "it's", correct: "its", position: 4},
                            {word: "departements", correct: "departments", position: 5}
                        ]
                    },
                    hard: {
                        text: "The phenomenon of climate change has been extensively studied by scientist's worldwide. Irregardless of political opinions, the data suggests that human activities are having a profound affect on global weather patterns. The research shows a strong coorelation between industrial emissions and rising temperatures, which has lead to increased flooding and drought conditions across different regions.",
                        errors: [
                            {word: "scientist's", correct: "scientists", position: 0},
                            {word: "Irregardless", correct: "Regardless", position: 1},
                            {word: "affect", correct: "effect", position: 2},
                            {word: "coorelation", correct: "correlation", position: 3},
                            {word: "lead", correct: "led", position: 4}
                        ]
                    }
                };

                return contents[difficulty];
            }

            generateTextHTML(content) {
                let html = content.text;
                const sortedErrors = [...content.errors].sort((a, b) => b.position - a.position);
                
                sortedErrors.forEach((error, index) => {
                    const regex = new RegExp(`\\b${error.word}\\b`, 'g');
                    html = html.replace(regex, `<span class="error-word" data-error="${index}" data-tooltip="Click to mark as error">${error.word}</span>`);
                });

                return html;
            }

            startGame() {
                this.gameActive = true;
                this.startTime = Date.now();
                this.foundErrors = 0;
                this.incorrectClicks = 0;
                this.hintsUsed = 0;
                
                this.elements.startBtn.classList.add('hidden');
                this.elements.hintBtn.classList.remove('hidden');
                this.elements.submitBtn.classList.remove('hidden');
                this.elements.hintsLeft.textContent = this.maxHints;
                this.elements.hintText.textContent = "Click on errors to mark them";
                
                this.startTimer();
                this.updateStats();
                this.updateProgressBar();
                
                // Add focus to text content for keyboard users
                this.elements.textContent.setAttribute('tabindex', '0');
                this.elements.textContent.focus();
            }

            startTimer() {
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    const elapsed = Date.now() - this.startTime;
                    const minutes = Math.floor(elapsed / 60000);
                    const seconds = Math.floor((elapsed % 60000) / 1000);
                    this.elements.timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }

            handleTextClick(e) {
                if (!this.gameActive) return;

                const errorWord = e.target.closest('.error-word');
                if (errorWord && !errorWord.classList.contains('found')) {
                    this.foundErrors++;
                    errorWord.classList.add('found');
                    this.showFeedback(errorWord, true);
                    
                    if (this.foundErrors === this.totalErrors) {
                        setTimeout(() => this.submitGame(), 500);
                    }
                } else if (e.target !== this.elements.textContent) {
                    this.incorrectClicks++;
                    this.showFeedback(e.target, false);
                }
                
                this.updateStats();
                this.updateProgressBar();
            }

            handleTextDblClick(e) {
                if (!this.gameActive) return;
                
                const wordElement = e.target.closest('.error-word');
                if (wordElement && !wordElement.classList.contains('found')) {
                    this.foundErrors++;
                    wordElement.classList.add('found');
                    this.showFeedback(wordElement, true);
                    
                    if (this.foundErrors === this.totalErrors) {
                        setTimeout(() => this.submitGame(), 500);
                    }
                } else if (e.target !== this.elements.textContent) {
                    this.incorrectClicks++;
                    this.showFeedback(e.target, false);
                }
                
                this.updateStats();
                this.updateProgressBar();
            }

            showFeedback(element, isCorrect) {
                const className = isCorrect ? 'found' : 'incorrect';
                element.classList.add(className);
                
                if (!isCorrect) {
                    setTimeout(() => {
                        element.classList.remove(className);
                    }, 1000);
                }
            }

            updateProgressBar() {
                const progress = this.totalErrors > 0 ? (this.foundErrors / this.totalErrors) * 100 : 0;
                this.elements.progressBar.style.width = `${progress}%`;
            }

            showHint() {
                if (this.hintsUsed >= this.maxHints) return;
                
                const unfoundErrors = document.querySelectorAll('.error-word:not(.found)');
                if (unfoundErrors.length > 0) {
                    const randomError = unfoundErrors[Math.floor(Math.random() * unfoundErrors.length)];
                    randomError.style.background = 'rgba(241, 196, 15, 0.3)';
                    randomError.style.fontWeight = 'bold';
                    
                    setTimeout(() => {
                        randomError.style.background = '';
                        randomError.style.fontWeight = '';
                    }, 3000);
                    
                    this.hintsUsed++;
                    this.elements.hintsLeft.textContent = this.maxHints - this.hintsUsed;
                    
                    if (this.hintsUsed >= this.maxHints) {
                        this.elements.hintBtn.disabled = true;
                    }
                }
            }

            submitGame() {
                this.gameActive = false;
                clearInterval(this.timerInterval);
                
                const endTime = Date.now();
                const totalTime = Math.round((endTime - this.startTime) / 1000);
                const accuracy = Math.round((this.foundErrors / (this.foundErrors + this.incorrectClicks)) * 100) || 100;
                const completionRate = Math.round((this.foundErrors / this.totalErrors) * 100);
                const score = this.calculateScore(totalTime, accuracy, completionRate);
                
                this.updateGameStats(score, totalTime, accuracy);
                this.checkAchievements(totalTime, accuracy, completionRate);
                this.showResults(totalTime, accuracy, completionRate, score);
            }

            calculateScore(time, accuracy, completion) {
                let baseScore = completion * 10;
                let timeBonus = Math.max(0, 300 - time) * 2;
                let accuracyBonus = accuracy * 5;
                let hintPenalty = this.hintsUsed * 50;
                
                const difficultyMultiplier = {
                    easy: 1,
                    medium: 1.5,
                    hard: 2
                };
                
                return Math.round((baseScore + timeBonus + accuracyBonus - hintPenalty) * difficultyMultiplier[this.currentDifficulty]);
            }

            updateStats() {
                this.elements.foundCount.textContent = this.foundErrors;
                this.elements.score.textContent = this.calculateScore(
                    this.startTime ? Math.round((Date.now() - this.startTime) / 1000) : 0,
                    this.calculateAccuracy(),
                    Math.round((this.foundErrors / this.totalErrors) * 100)
                );
                this.elements.accuracy.textContent = this.calculateAccuracy() + '%';
            }

            calculateAccuracy() {
                const totalClicks = this.foundErrors + this.incorrectClicks;
                return totalClicks > 0 ? Math.round((this.foundErrors / totalClicks) * 100) : 100;
            }

            updateGameStats(score, time, accuracy) {
                this.gameStats.gamesPlayed++;
                this.gameStats.totalScore += score;
                
                if (!this.gameStats.bestTime || time < this.gameStats.bestTime) {
                    this.gameStats.bestTime = time;
                }
                
                if (accuracy > this.gameStats.bestAccuracy) {
                    this.gameStats.bestAccuracy = accuracy;
                }
                
                localStorage.setItem('typoHuntStats', JSON.stringify(this.gameStats));
            }

            checkAchievements(time, accuracy, completion) {
                const newAchievements = [];
                
                if (completion === 100 && !this.gameStats.achievements.includes('perfectionist')) {
                    newAchievements.push({id: 'perfectionist', name: 'Perfectionist', desc: 'Found all errors!'});
                }
                
                if (accuracy === 100 && !this.gameStats.achievements.includes('sharpshooter')) {
                    newAchievements.push({id: 'sharpshooter', name: 'Sharpshooter', desc: 'Perfect accuracy!'});
                }
                
                if (time < 30 && !this.gameStats.achievements.includes('speedster')) {
                    newAchievements.push({id: 'speedster', name: 'Speed Demon', desc: 'Completed in under 30 seconds!'});
                }
                
                if (this.hintsUsed === 0 && !this.gameStats.achievements.includes('independent')) {
                    newAchievements.push({id: 'independent', name: 'Independent', desc: 'No hints needed!'});
                }
                
                if (time < 60 && completion >= 90 && !this.gameStats.achievements.includes('efficient')) {
                    newAchievements.push({id: 'efficient', name: 'Efficiency Expert', desc: 'High completion in under a minute!'});
                }
                
                newAchievements.forEach(achievement => {
                    this.gameStats.achievements.push(achievement.id);
                    this.achievements.push(achievement);
                });
            }

            showResults(time, accuracy, completion, score) {
                const minutes = Math.floor(time / 60);
                const seconds = time % 60;
                const timeString = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                let resultsHTML = `
                    <div class="fade-in">
                        <h3><i class="fas fa-trophy"></i> Game Complete!</h3>
                        
                        <div class="score-details">
                            <div class="score-item">
                                <div class="label">Final Score</div>
                                <div class="value">${score}</div>
                            </div>
                            <div class="score-item">
                                <div class="label">Time</div>
                                <div class="value">${timeString}</div>
                            </div>
                            <div class="score-item">
                                <div class="label">Accuracy</div>
                                <div class="value">${accuracy}%</div>
                            </div>
                            <div class="score-item">
                                <div class="label">Completion</div>
                                <div class="value">${completion}%</div>
                            </div>
                        </div>
                        
                        ${this.achievements.length > 0 ? `
                            <div class="achievements-container">
                                <h4><i class="fas fa-medal"></i> New Achievements!</h4>
                                ${this.achievements.map(a => `<span class="achievement">${a.name}: ${a.desc}</span>`).join('')}
                            </div>
                        ` : ''}
                        
                        <div class="leaderboard">
                            <h4><i class="fas fa-chart-bar"></i> Your Statistics</h4>
                            <div class="leaderboard-entry">
                                <span>Games Played</span>
                                <strong>${this.gameStats.gamesPlayed}</strong>
                            </div>
                            <div class="leaderboard-entry">
                                <span>Average Score</span>
                                <strong>${this.gameStats.gamesPlayed ? Math.round(this.gameStats.totalScore / this.gameStats.gamesPlayed) : 0}</strong>
                            </div>
                            <div class="leaderboard-entry">
                                <span>Best Accuracy</span>
                                <strong>${this.gameStats.bestAccuracy}%</strong>
                            </div>
                            <div class="leaderboard-entry">
                                <span>Best Time</span>
                                <strong>${this.gameStats.bestTime ? Math.floor(this.gameStats.bestTime / 60) + ':' + (this.gameStats.bestTime % 60).toString().padStart(2, '0') : 'N/A'}</strong>
                            </div>
                        </div>
                        
                        <div class="controls" style="margin-top: 25px;">
                            <button class="btn btn-primary" id="play-again-btn">
                                <i class="fas fa-redo"></i> Play Again
                            </button>
                            <button class="btn btn-info" id="analysis-btn">
                                <i class="fas fa-chart-line"></i> Detailed Analysis
                            </button>
                        </div>
                    </div>
                `;
                
                this.elements.gameContent.classList.add('hidden');
                this.elements.results.innerHTML = resultsHTML;
                this.elements.results.classList.remove('hidden');
                
                // Add event listeners to new buttons
                document.getElementById('play-again-btn').addEventListener('click', () => this.resetGame());
                document.getElementById('analysis-btn').addEventListener('click', () => this.showDetailedAnalysis());
                
                // Reset achievements array for next game
                this.achievements = [];
            }

            resetGame() {
                this.elements.gameContent.classList.remove('hidden');
                this.elements.results.classList.add('hidden');
                this.elements.startBtn.classList.remove('hidden');
                this.elements.hintBtn.classList.add('hidden');
                this.elements.submitBtn.classList.add('hidden');
                this.elements.hintText.textContent = "Click on errors to mark them";
                
                this.loadContent();
                this.updateStats();
                this.updateProgressBar();
                
                // Reset timer
                this.elements.timer.textContent = "00:00";
                clearInterval(this.timerInterval);
            }

            showDetailedAnalysis() {
                this.elements.results.innerHTML = `
                    <div class="loading">
                        <div class="loader"></div>
                    </div>
                `;
                
                setTimeout(() => {
                    const analysis = this.generateDetailedAnalysis();
                    
                    const analysisHTML = `
                        <div class="fade-in">
                            <h3><i class="fas fa-microscope"></i> Detailed Performance Analysis</h3>
                            
                            <div class="score-details">
                                <div class="score-item">
                                    <div class="label">Errors Found</div>
                                    <div class="value">${this.foundErrors}/${this.totalErrors}</div>
                                </div>
                                <div class="score-item">
                                    <div class="label">Incorrect Clicks</div>
                                    <div class="value">${this.incorrectClicks}</div>
                                </div>
                                <div class="score-item">
                                    <div class="label">Hints Used</div>
                                    <div class="value">${this.hintsUsed}/${this.maxHints}</div>
                                </div>
                                <div class="score-item">
                                    <div class="label">Difficulty</div>
                                    <div class="value">${this.currentDifficulty.toUpperCase()}</div>
                                </div>
                            </div>
                            
                            <div style="margin: 25px 0;">
                                <h4><i class="fas fa-list"></i> Missed Errors</h4>
                                ${analysis.missedErrors.length > 0 ? `
                                    <div style="margin: 15px 0;">
                                        ${analysis.missedErrors.map(error => `
                                            <div class="insight-item">
                                                <i class="fas fa-exclamation-circle insight-icon"></i>
                                                <strong>"${error.word}"</strong> should be <strong>"${error.correct}"</strong>
                                                <div style="font-size: 0.95em; color: #495057; margin-top: 8px;">
                                                    ${this.getErrorExplanation(error.word, error.correct)}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : '<p style="color: #28a745; font-weight: bold; text-align: center; padding: 15px;">🎉 You found all errors! Excellent work!</p>'}
                            </div>
                            
                            <div style="margin: 25px 0;">
                                <h4><i class="fas fa-lightbulb"></i> Performance Insights</h4>
                                <div style="margin-top: 15px;">
                                    ${analysis.insights.map(insight => `
                                        <div class="insight-item">
                                            <i class="fas fa-arrow-right insight-icon"></i>
                                            ${insight}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div class="controls">
                                <button class="btn btn-primary" id="back-to-results-btn">
                                    <i class="fas fa-arrow-left"></i> Back to Results
                                </button>
                                <button class="btn btn-warning" id="export-btn">
                                    <i class="fas fa-download"></i> Export Results
                                </button>
                            </div>
                        </div>
                    `;
                    
                    this.elements.results.innerHTML = analysisHTML;
                    
                    // Add event listeners to new buttons
                    document.getElementById('back-to-results-btn').addEventListener('click', () => this.showResults());
                    document.getElementById('export-btn').addEventListener('click', () => this.exportResults());
                }, 800);
            }

            generateDetailedAnalysis() {
                const allErrorElements = document.querySelectorAll('.error-word');
                const missedErrors = [];
                
                allErrorElements.forEach((element) => {
                    if (!element.classList.contains('found')) {
                        const errorIndex = parseInt(element.dataset.error);
                        if (this.currentText.errors[errorIndex]) {
                            missedErrors.push(this.currentText.errors[errorIndex]);
                        }
                    }
                });
                
                const insights = this.generateInsights();
                
                return {
                    missedErrors,
                    insights
                };
            }

            generateInsights() {
                const insights = [];
                const accuracy = this.calculateAccuracy();
                const completion = Math.round((this.foundErrors / this.totalErrors) * 100);
                const totalTime = this.startTime ? Math.round((Date.now() - this.startTime) / 1000) : 0;
                
                if (accuracy >= 90) {
                    insights.push("Outstanding accuracy! You have excellent attention to detail.");
                } else if (accuracy >= 70) {
                    insights.push("Good accuracy, but try to be more selective with your clicks.");
                } else {
                    insights.push("Focus on accuracy over speed. Take time to carefully examine each word.");
                }
                
                if (completion === 100) {
                    insights.push("Perfect completion! You found every single error.");
                } else if (completion >= 80) {
                    insights.push("Great job! You found most of the errors.");
                } else {
                    insights.push("Try reading more slowly and carefully to catch all errors.");
                }
                
                if (totalTime < 60) {
                    insights.push("Impressive speed! You completed the challenge quickly.");
                } else if (totalTime < 120) {
                    insights.push("Good timing. Balance speed with thoroughness.");
                } else {
                    insights.push("Take your time, but try to maintain focus for better efficiency.");
                }
                
                if (this.hintsUsed === 0) {
                    insights.push("Independent work! You didn't need any hints.");
                } else if (this.hintsUsed <= 1) {
                    insights.push("Good self-reliance with minimal hint usage.");
                } else {
                    insights.push("Try to rely less on hints to build confidence in your skills.");
                }
                
                const difficultyAdvice = {
                    easy: "Ready for medium difficulty? Try more complex grammar challenges!",
                    medium: "Consider trying hard difficulty for professional-level challenges.",
                    hard: "Excellent work on the hardest difficulty! You're a true grammar expert."
                };
                
                insights.push(difficultyAdvice[this.currentDifficulty]);
                
                return insights;
            }

            getErrorExplanation(incorrect, correct) {
                const explanations = {
                    "sentance": "Common spelling error - 'sentence' ends with '-ence'",
                    "erors": "Spelling mistake - correct spelling is 'errors'",
                    "Their": "Wrong usage - 'There' indicates location/existence",
                    "Its": "Missing apostrophe - 'It's' is a contraction of 'it is'",
                    "proofreading": "Wrong verb form - should be 'proofread' (infinitive)",
                    "dont": "Missing apostrophe in contraction",
                    "grammer": "Common misspelling - correct spelling is 'grammar'",
                    "profesional": "Missing letter - correct spelling is 'professional'",
                    "companys": "Missing apostrophe for possessive - 'company's'",
                    "revnue": "Transposed letters - correct spelling is 'revenue'",
                    "their": "Wrong pronoun - should be 'the' for clarity",
                    "have": "Subject-verb disagreement - 'board' is singular, needs 'has'",
                    "it's": "Wrong usage - 'its' is possessive (no apostrophe)",
                    "departements": "Spelling error - correct spelling is 'departments'",
                    "scientist's": "Unnecessary apostrophe - plural form is 'scientists'",
                    "Irregardless": "Non-standard word - use 'Regardless'",
                    "affect": "Wrong word choice - 'effect' is the noun form",
                    "coorelation": "Spelling error - correct spelling is 'correlation'",
                    "lead": "Wrong tense - past tense should be 'led'"
                };
                
                return explanations[incorrect] || "Grammar or spelling correction needed.";
            }

            exportResults() {
                const endTime = Date.now();
                const totalTime = Math.round((endTime - this.startTime) / 1000);
                const accuracy = this.calculateAccuracy();
                const completionRate = Math.round((this.foundErrors / this.totalErrors) * 100);
                const score = this.calculateScore(totalTime, accuracy, completionRate);
                
                const results = {
                    timestamp: new Date().toISOString(),
                    difficulty: this.currentDifficulty,
                    score: score,
                    errorsFound: this.foundErrors,
                    totalErrors: this.totalErrors,
                    accuracy: accuracy,
                    completionRate: completionRate,
                    timeSpent: totalTime,
                    hintsUsed: this.hintsUsed,
                    incorrectClicks: this.incorrectClicks,
                    achievements: this.achievements.map(a => a.name)
                };
                
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(results, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `typo-hunt-results-${Date.now()}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                
                // Create a readable summary
                const summary = `
TYPO HUNT CHALLENGE - PERFORMANCE REPORT
========================================

Date: ${new Date().toLocaleDateString()}
Difficulty: ${this.currentDifficulty.toUpperCase()}
Final Score: ${score}

PERFORMANCE METRICS:
- Errors Found: ${results.errorsFound}/${results.totalErrors}
- Completion Rate: ${results.completionRate}%
- Accuracy: ${results.accuracy}%
- Time Spent: ${Math.floor(results.timeSpent / 60)}:${(results.timeSpent % 60).toString().padStart(2, '0')}
- Hints Used: ${results.hintsUsed}/${this.maxHints}
- Incorrect Clicks: ${results.incorrectClicks}

ACHIEVEMENTS:
${results.achievements.length > 0 ? results.achievements.map(a => `- ${a}`).join('\n') : '- None unlocked'}

OVERALL STATISTICS:
- Games Played: ${this.gameStats.gamesPlayed}
- Average Score: ${this.gameStats.gamesPlayed ? Math.round(this.gameStats.totalScore / this.gameStats.gamesPlayed) : 0}
- Best Time: ${this.gameStats.bestTime ? Math.floor(this.gameStats.bestTime / 60) + ':' + (this.gameStats.bestTime % 60).toString().padStart(2, '0') : 'N/A'}
- Best Accuracy: ${this.gameStats.bestAccuracy}%

Generated by Typo Hunt Challenge - Professional Edition
                `.trim();
                
                const summaryStr = "data:text/plain;charset=utf-8," + encodeURIComponent(summary);
                const summaryDownload = document.createElement('a');
                summaryDownload.setAttribute("href", summaryStr);
                summaryDownload.setAttribute("download", `typo-hunt-summary-${Date.now()}.txt`);
                document.body.appendChild(summaryDownload);
                summaryDownload.click();
                summaryDownload.remove();
            }

            showResults() {
                const endTime = Date.now();
                const totalTime = Math.round((endTime - this.startTime) / 1000);
                const accuracy = this.calculateAccuracy();
                const completionRate = Math.round((this.foundErrors / this.totalErrors) * 100);
                const score = this.calculateScore(totalTime, accuracy, completionRate);
                
                this.showResults(totalTime, accuracy, completionRate, score);
            }
        }

        // Initialize the game when the page loads
        let game;
        document.addEventListener('DOMContentLoaded', () => {
            game = new TypoHuntGame();
            
            // Add keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !game.gameActive) {
                    game.startGame();
                } else if (e.key === 'h' || e.key === 'H') {
                    if (game.gameActive) {
                        game.showHint();
                    }
                } else if (e.key === ' ' && game.gameActive) {
                    e.preventDefault();
                    game.submitGame();
                } else if (e.key === 'r' || e.key === 'R') {
                    if (!game.gameActive && document.getElementById('play-again-btn')) {
                        document.getElementById('play-again-btn').click();
                    }
                }
            });
            
            // Button animation
            document.addEventListener('click', (e) => {
                if (e.target.matches('.btn, .difficulty-btn')) {
                    e.target.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        e.target.style.transform = '';
                    }, 100);
                }
            });
        });
    </script>
</body>
</html>
